
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoManager | Clientes</title>
    <link rel="stylesheet" href="../css/clientes.css">
    <link rel="icon" type="image/x-icon" href="../assets/icons/carro.ico">
</head>

<body>

    <aside class="sidebar">
        <div class="logo">
            <h2>AutoManager</h2>
            <span>Gestão automotiva</span>
        </div>

        <nav>
            <a href="../index.html">Dashboard</a>
            <a href="clientes.html" class="active">Clientes</a>
            <a href="veiculos.html">Veículos</a>
            <a href="estoque.html">Estoque</a>
            <a href="pdv.html">PDV</a>
            <a href="vendas.html">Vendas</a>
            <a href="funcionarios.html">Funcionários</a>
        </nav>

        <div class="sidebar-footer">
            Sistema de gerenciamento
        </div>
    </aside>

    <main class="main-content">

        <section class="form-section">

            <h2 id="form-title">Cadastrar cliente</h2>

            <form id="cliente-form">

                <input type="hidden" id="cliente-id">

                <div class="form-grid">

                    <div>
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div>
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" required>
                    </div>

                    <div>
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" maxlength="11">
                    </div>

                    <div>
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone">
                    </div>

                    <div>
                        <label for="email">E-mail</label>
                        <input type="email" id="email">
                    </div>

                    <div>
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco">
                    </div>

                </div>

                <div class="form-buttons">

                    <button type="submit" id="btn-salvar">
                        Cadastrar cliente
                    </button>

                    <button type="button" id="btn-cancelar" hidden>
                        Cancelar edição
                    </button>

                </div>

            </form>

        </section>

        <section class="table-section">

            <h2>Clientes cadastrados</h2>

            <input
                type="search"
                id="pesquisa"
                placeholder="Pesquisar cliente..."
            >

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Telefone</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="clientes-lista">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="../js/clientes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
